upload_pattern:
  fields:
    device_id:
      selector:
        device:
          integration: homedics_drift
    name:
      required: true
      example: Spiral
      selector:
        text:
    path:
      example: /config/drift_patterns/spiral.thr
      selector:
        text:
    thr:
      selector:
        text:
          multiline: true

delete_pattern:
  fields:
    device_id:
      selector:
        device:
          integration: homedics_drift
    pattern_id:
      example: 50000
      selector:
        number:
          min: 50000
          max: 65535
          mode: box
    name:
      example: Spiral
      selector:
        text:

rename_pattern:
  fields:
    device_id:
      selector:
        device:
          integration: homedics_drift
    pattern_id:
      required: true
      example: 12
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    name:
      required: true
      example: Evening spiral
      selector:
        text:

ai_draw:
  fields:
    device_id:
      selector:
        device:
          integration: homedics_drift
    prompt:
      required: true
      example: a five pointed star
      selector:
        text:
          multiline: true
    name:
      example: Star
      selector:
        text:
    play:
      default: false
      selector:
        boolean:

generate_pattern:
  fields:
    device_id:
      selector:
        device:
          integration: homedics_drift
    type:
      required: true
      example: spiral
      selector:
        select:
          options:
            - spiral
            - rose
            - star
            - wave
            - spirograph
    name:
      example: Rose
      selector:
        text:
    play:
      default: false
      selector:
        boolean:
    turns:
      selector:
        number:
          min: 1
          max: 40
          mode: box
    petals:
      selector:
        number:
          min: 2
          max: 12
          mode: box
    points:
      selector:
        number:
          min: 3
          max: 12
          mode: box
    waves:
      selector:
        number:
          min: 1
          max: 24
          mode: box
    loops:
      selector:
        number:
          min: 1
          max: 12
          mode: box
    R:
      selector:
        number:
          min: 1
          max: 20
          mode: box
    r:
      selector:
        number:
          min: 0.2
          max: 19
          mode: box
    d:
      selector:
        number:
          min: 0.1
          max: 20
          mode: box
